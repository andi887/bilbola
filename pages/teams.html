<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Daftar Tim Sepak Bola Dunia</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; }
    h2 { background: #eee; padding: 8px; margin-top: 25px; }
    ul { columns: 2; }
  </style>
</head>
<body>
  <h1>Daftar Tim Sepak Bola Dunia</h1>
  <div id="daftar-tim">Loading...</div>

  <script>
    // PENTING: karena file ini di /pages/, harus pakai ../data/
    fetch('../data/teams.json')
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        const container = document.getElementById('daftar-tim');
        container.innerHTML = '';
        
        for (const [liga, klubList] of Object.entries(data)) {
          const h2 = document.createElement('h2');
          h2.textContent = liga;
          container.appendChild(h2);

          const ul = document.createElement('ul');
          klubList.forEach(nama => {
            const li = document.createElement('li');
            li.textContent = nama;
            ul.appendChild(li);
          });
          container.appendChild(ul);
        }
      })
      .catch(e => {
        document.getElementById('daftar-tim').textContent = 'Gagal load: ' + e.message;
        console.error(e);
      });
  </script>
</body>
</html>
