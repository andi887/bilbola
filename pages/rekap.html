<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Prediksi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .rekap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
    .rekap-card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #0078D7; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; color: #666; }
    .match-teams { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; text-align: center; }
    .vs { color: #0078D7; padding: 0 10px; }
    .match-odds { display: flex; gap: 10px; margin-bottom: 10px; }
    .odd-box { flex: 1; background: #f0f8ff; border: 1px solid #cce5ff; border-radius: 5px; padding: 8px; text-align: center; color: #004085; }
    .btn-hapus { background: #fee2e2; color: #dc2626; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Rekap Prediksi</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="generator.html">Generator</a></li>
        <li><a href="rekap.html" style="text-decoration: underline;">Rekap</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div style="padding: 20px; text-align: right;">
      <button id="btnRefresh" style="padding: 10px 20px; background: #0078D7; color: white; border: none; border-radius: 5px; cursor: pointer;">🔄 Refresh Data</button>
    </div>
    <div id="rekapContainer" class="rekap-grid">
      <div class="empty-state">Memuat data...</div a>
    </div>
  </main>

  <script type="module">
    import { initFirestore, getAllPredictions, deletePrediction } from '../js/firestore-service.js';

    const container = document.getElementById('rekapContainer');
    const btnRefresh = document.getElementById('btnRefresh');

    async function renderRekap() {
      container.innerHTML = '<div class="empty-state">Memuat data dari Firestore...</div>';
      await initFirestore();
      const data = await getAllPredictions();
      
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>📭 Belum ada data</h3><p>Generate prediksi dulu di halaman Generator.</p></div>';
        return;
      }

      container.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'rekap-card';
        card.innerHTML = `
          <div class="card-header">
            <span>📅 ${item.waktu}</span>
            <button class="btn-hapus" data-id="${item.id}">Hapus</button>
          </div>
          <div class="match-teams">
            <span>${item.tim1 || 'Tim 1'}</span>
            <span class="vs">VS</span>
            <span>${item.tim2 || 'Tim 2'}</span>
          </div>
          <div class="match-odds">
            <div class="odd-box"><strong>1</strong><br>${item.odds1 || '-'}</div>
            <div class="odd-box"><strong>X</strong><br>${item.oddsDraw || '-'}</div>
            <div class="odd-box"><strong>2</strong><br>${item.odds2 || '-'}</div>
          </div>
          <div style="text-align: center; font-size: 0.9rem; color: #15803d; background: #f0fdf4; padding: 8px; border-radius: 5px;">
            <strong>Top Score:</strong> ${item.topScore || '-'} | <strong>xG:</strong> ${item.xgA?.toFixed(2) || '-'} - ${item.xgB?.toFixed(2) || '-'}
          </div>
        `;
        container.appendChild(card);
      });

      document.querySelectorAll('.btn-hapus').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm('Hapus data ini?')) {
            const id = e.target.getAttribute('data-id');
            await deletePrediction(id);
            renderRekap();
          }
        });
      });
    }

    btnRefresh.addEventListener('click', renderRekap);
    renderRekap();
  </script>
</body>
</html>
